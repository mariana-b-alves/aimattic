<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" placeholder="img/favicon" href="../main_page/favicon.png">
    <title>Criar Nova Conta/AIMattic</title>
</head>
<body>
    <div class="container">
        <div class="container-area">
            <div class="txt">
                <h1>Cria a tua conta</h1>
                <p>Já tens a tua própria conta? <a href ="../login/login.html">Inicia sessão aqui.</a></p>
                <form class="win" method="SUBMIT">
                     <input type="text" class="text-field" id = "name" placeholder="Nome" required>
                     <input type="text" class="text-field" id ="email" placeholder="Email" required>
                     <input type="password" class="text-field" id ="email" placeholder="Password" required>

                    <div class="form-checkbox">
                        <input type="checkbox">
                        <label>Mantem-me ligado.</label>
                    </div>
                    
                    <div class="input-btn">
                        <button id ="mainpage-btn">
                            <a href="../../index.html">Iniciar sessão</a>
                        </button>
                    </div>
                </form>

                <div class="input-btn">
                    <button id ="login-btn">
                        <a href="../sign_up/signup.html">Criar conta</a>
                    </button>
                 </div>
            </div>

    <script src="app.js"></script>
</body>
</html>
